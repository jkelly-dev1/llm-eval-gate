name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Pinned to current majors (verified against the CI-green sibling repos):
      # checkout v7, setup-python v7.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      # The eval gate is the guardrail: it exits 1 when the golden set
      # regresses, so a prompt or threshold change that makes the system under
      # test ship a quality regression cannot merge. The gate also refuses to
      # run at all when the threshold sits inside the judges' measured noise
      # floor, because a pass or fail signal narrower than the noise is not a
      # signal.
      - name: Eval gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m eval_gate.evals.gate

      # This demo runs the whole offline pipeline: if the demo breaks, the
      # build breaks. Running it does not show that SAMPLE_RUN.md still
      # matches it; the next step does.
      - name: Demo (offline mock)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py

      # SAMPLE_RUN.md's demo and five gate captures against fresh runs, with
      # timestamps, run ids and hashes set aside. A capture taken before a fix
      # fails here instead of shipping, and so does a hand written figure in
      # the findings or the README that no capture holds.
      - name: SAMPLE_RUN.md matches fresh runs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_sample_run.py

      # Every test id in the README's claims table must still be collected.
      - name: README claims table resolves
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/verify_claims_table.py
